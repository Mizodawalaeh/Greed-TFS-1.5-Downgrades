name: Build Windows x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          echo "C:\vcpkg" >> $env:GITHUB_PATH

      - name: Install dependencies
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear
        run: |
          C:\vcpkg\vcpkg.exe install boost-system:x64-windows boost-iostreams:x64-windows boost-filesystem:x64-windows boost-asio:x64-windows pugixml:x64-windows cryptopp:x64-windows luajit:x64-windows fmt:x64-windows mysql-connector-cpp:x64-windows --triplet x64-windows

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -A x64 `
            -DMYSQL_INCLUDE_DIR="C:/vcpkg/installed/x64-windows/include/mysql" `
            -DMYSQL_LIBRARY="C:/vcpkg/installed/x64-windows/lib/mysqlclient.lib"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect binary and DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item build/Release/theforgottenserver.exe release/
          Copy-Item C:\vcpkg\installed\x64-windows\bin\*.dll release/ -ErrorAction SilentlyContinue
          Copy-Item key.pem release/ -ErrorAction SilentlyContinue

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: theotserver-windows-x64
          path: release/
          retention-days: 30
